name: hangmeow
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
  - assets/happy.png
  - assets/joy.png
  - assets/joyous.png
  - assets/neutral.png
  - assets/plant3.png
  - assets/sad.png
  - assets/teardrop.png
  - assets/water2.png
  - assets/sounds/victory.mp3

  fonts:
      - family: LuckiestGuy
        fonts:
          - asset: assets/fonts/Luckiest_Guy/LuckiestGuy-Regular.ttf
      - family: Marcellus
        fonts:
          - asset: assets/fonts/Marcellus_SC/MarcellusSC-Regular.ttf
      - family: Montserrat
        fonts:
          - asset: assets/fonts/Montserrat/static/Montserrat-Regular.ttf
